services:
  mysql:
    image: mysql:8.0
    container_name: hakoniwa-mysql
    env_file:
      - path: .env.production.local
        required: true
    environment:
      TZ: Asia/Tokyo
    ports:
      - '127.0.0.1:13306:3306'
    volumes:
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ORIGIN_URL: ${NEXT_PUBLIC_ORIGIN_URL:?set NEXT_PUBLIC_ORIGIN_URL with --env-file .env.production.local}
        NEXT_PUBLIC_RP_ID: ${NEXT_PUBLIC_RP_ID:?set NEXT_PUBLIC_RP_ID with --env-file .env.production.local}
    container_name: hakoniwa-app
    env_file:
      - path: .env.production
        required: false
      - path: .env.production.local
        required: true
    environment:
      DB_TYPE: mysql
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./log:/app/log
    command: sh -c 'export DB_CONNECTION_STRING="$$DOCKER_DB_CONNECTION_STRING"; export NEXT_PUBLIC_ORIGIN_URL="$$DOCKER_NEXT_PUBLIC_ORIGIN_URL"; npx tsx ./src/db/migrate.ts && npm start'

  web:
    image: nginx:latest
    container_name: hakoniwa-web
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.certs:/etc/nginx/certs:ro
    depends_on:
      - app

volumes:
  db_data:
