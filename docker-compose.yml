services:
  mysql:
    image: mysql:8.0
    container_name: hakoniwa-mysql
    environment:
      TZ: Asia/Tokyo
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - '127.0.0.1:${MYSQL_HOST_PORT:-13306}:3306'
    volumes:
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ORIGIN_URL: ${NEXT_PUBLIC_ORIGIN_URL:-}
        NEXT_PUBLIC_RP_ID: ${NEXT_PUBLIC_RP_ID:-}
    container_name: hakoniwa-app
    environment:
      DB_TYPE: mysql
      DB_CONNECTION_STRING: ${DOCKER_DB_CONNECTION_STRING:?DOCKER_DB_CONNECTION_STRING is required}
      PASSKEY_FP_PEPPER: ${PASSKEY_FP_PEPPER:?PASSKEY_FP_PEPPER is required}
      MODERATOR_INITIAL_ID: ${MODERATOR_INITIAL_ID:?MODERATOR_INITIAL_ID is required}
      MODERATOR_INITIAL_PASSWORD: ${MODERATOR_INITIAL_PASSWORD:?MODERATOR_INITIAL_PASSWORD is required}
      MODERATOR_INITIAL_USER_NAME: ${MODERATOR_INITIAL_USER_NAME:?MODERATOR_INITIAL_USER_NAME is required}
      LOG_BASE_DIR: ${LOG_BASE_DIR:-log}
      LOG_TRANSPORT_MODE: ${LOG_TRANSPORT_MODE:-file}
      LOG_S3_BUCKET: ${LOG_S3_BUCKET:-}
      LOG_S3_REGION: ${LOG_S3_REGION:-us-east-1}
      LOG_S3_ENDPOINT: ${LOG_S3_ENDPOINT:-}
      LOG_S3_ACCESS_KEY_ID: ${LOG_S3_ACCESS_KEY_ID:-}
      LOG_S3_SECRET_ACCESS_KEY: ${LOG_S3_SECRET_ACCESS_KEY:-}
      LOG_S3_KEY_PREFIX: ${LOG_S3_KEY_PREFIX:-logs}
      LOG_S3_FORCE_PATH_STYLE: ${LOG_S3_FORCE_PATH_STYLE:-false}
      NEXT_PUBLIC_ORIGIN_URL: ${DOCKER_NEXT_PUBLIC_ORIGIN_URL:?DOCKER_NEXT_PUBLIC_ORIGIN_URL is required}
      NEXT_PUBLIC_RP_ID: ${NEXT_PUBLIC_RP_ID:?NEXT_PUBLIC_RP_ID is required}
      ISSUER: ${ISSUER:?ISSUER is required}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./log:/app/log
    command: sh -c 'npx tsx ./src/db/migrate.ts && npm start'

  web:
    image: nginx:latest
    container_name: hakoniwa-web
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.certs:/etc/nginx/certs:ro
    depends_on:
      - app

volumes:
  db_data:
